<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up | ProofTrail</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-expand-md"><div class="container"><a class="navbar-brand fw-bold" href="index.html">ProofTrail</a>
<button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#m"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="m"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="verify.html">Verify a Credential</a></li><li class="nav-item"><a class="nav-link" href="login.html">Log in</a></li><li class="nav-item"><a class="nav-link active" href="signup.html">Sign up</a></li></ul></div></div></nav>

<div class="auth-wrap"><div class="panel"><h3 class="mb-3">Create an account</h3>
<form id="f"><div class="mb-3"><label class="form-label" for="role">I am a</label>
<select id="role" class="form-select"><option value="h">Student / Graduate (Holder)</option><option value="i">Institution (Issuer)</option></select></div>
<div class="mb-3"><label class="form-label" for="n" id="nl">Full name</label><input id="n" class="form-control" required></div>
<div class="mb-3"><label class="form-label" for="e">Email</label><input id="e" type="email" class="form-control" required></div>
<div class="mb-3" id="reg" style="display:none"><label class="form-label" for="r">Registration / HEC number</label><input id="r" class="form-control"></div>
<div class="mb-3"><label class="form-label" for="p">Password</label><input id="p" type="password" class="form-control" minlength="8" required></div>
<div class="mb-3"><label class="form-label" for="c">Confirm password</label><input id="c" type="password" class="form-control" required></div>
<p class="small text-muted" id="note" style="display:none">Institution accounts are active after Admin approval.</p>
<button class="btn btn-seal w-100">Sign up</button></form>
<p class="mt-3 mb-0 small">Already registered? <a href="login.html">Log in</a></p></div></div>
<footer class="container text-center">ProofTrail - Digital Credential and Skill Verification Platform.</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
var r=document.getElementById("role");
r.addEventListener("change",function(){var i=r?.value=="i";document.getElementById("reg").style.display=i?"block":"none";document.getElementById("note").style.display=i?"block":"none";document.getElementById("nl").textContent=i?"Institution name":"Full name";});
document.getElementById("f")?.addEventListener("submit",function(e){e.preventDefault();if(document.getElementById("p")?.value!==document.getElementById("c")?.value){alert("Passwords do not match.");return;}location.href="login.html";});
</script>
</body></html>
