<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | ProofTrail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-md">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">ProofTrail</a>
            <button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#m"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="m"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="verify.html">Verify a Credential</a></li><li class="nav-item"><a class="nav-link active" href="login.html">Log in</a></li><li class="nav-item"><a class="nav-link" href="signup.html">Sign up</a></li></ul></div>
        </div>
    </nav>

    <div class="auth-wrap">
        <div class="panel">
            <h3 class="mb-3">Log in</h3>
            <form id="f">
                <div class="mb-3">
                    <label class="form-label" for="role">Log in as</label>
                    <select id="role" class="form-select">
                        <option value="holder-dashboard.html">Holder (Student)</option>
                        <option value="issuer-dashboard.html">Issuer (Institution)</option>
                        <option value="admin-dashboard.html">System Admin</option>
                    </select>
                </div>
                <div class="mb-3"><label class="form-label" for="e">Email</label><input id="e" type="email" class="form-control" required></div>
                <div class="mb-3"><label class="form-label" for="p">Password</label><input id="p" type="password" class="form-control" required></div>
                <button class="btn btn-seal w-100">Log in</button>
            </form>
            <p class="mt-3 mb-0 small">No account? <a href="signup.html">Sign up</a>. Verifiers do not need to log in: <a href="verify.html">verify a credential</a>.</p>
        </div>
    </div>
    <footer class="container text-center">ProofTrail - Digital Credential and Skill Verification Platform.</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>document.getElementById("f")?.addEventListener("submit",function(e){e.preventDefault();location.href=document.getElementById("role")?.value;});</script>
</body>
</html>
